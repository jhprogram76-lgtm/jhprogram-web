<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,follow">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="theme-color" content="#f7f3e6">
    <title>Página no encontrada | jhprogram Studio</title>
    <link rel="icon" href="logo2.webp" type="image/webp">
    <style>
        :root{--bg:#f7f3e6;--paper:#fffdf3;--ink:#27331c;--ink-soft:#5c6b47;--hoja:#48642d;--limon:#eccf82;--line:rgba(39,51,28,.3)}
        *{box-sizing:border-box}
        body{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background-color:var(--bg);background-image:linear-gradient(rgba(39,51,28,.16) 1px,transparent 1px),linear-gradient(90deg,rgba(39,51,28,.16) 1px,transparent 1px);background-size:28px 28px;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 24px;text-align:center}
        .card{background:var(--paper);border:1px solid var(--line);border-radius:26px 26px 26px 4px;padding:56px 44px;max-width:480px;box-shadow:0 26px 60px rgba(39,51,28,.14)}
        .codigo{font-family:Georgia,"Times New Roman",serif;font-style:italic;font-weight:600;font-size:5rem;line-height:1;color:var(--hoja);margin-bottom:12px}
        h1{font-family:Georgia,"Times New Roman",serif;font-style:italic;font-weight:600;font-size:1.6rem;margin:0 0 14px;color:var(--ink)}
        p{color:var(--ink-soft);font-size:15px;line-height:1.6;margin:0 0 28px}
        a.btn{display:inline-block;padding:14px 32px;background:var(--limon);color:var(--ink);text-decoration:none;font-weight:700;font-size:14.5px;border-radius:30px;transition:transform .2s,background-color .2s}
        a.btn:hover,a.btn:focus-visible{background:#c9a253;transform:translateY(-2px)}
        a:focus-visible{outline:3px solid var(--limon);outline-offset:3px}
    </style>
</head>
<body>
    <main class="card">
        <div class="codigo" aria-hidden="true">404</div>
        <h1>Esta página se ha perdido por el camino</h1>
        <p>El enlace que has seguido no existe o se ha movido. Vuelve al inicio y te ayudamos a encontrar lo que buscabas.</p>
        <a class="btn" href="index.html">Volver a jhprogram Studio</a>
    </main>
</body>
</html>
