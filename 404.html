<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página no encontrada - jhprogram</title>
    <meta name="robots" content="noindex, follow">
    <link rel="icon" href="logo2.png" type="image/png">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,420..700;1,9..144,420..600&family=Nunito:wght@400;600;700;800&display=swap');
        :root{
            --bg:#f7f3e6;--paper:#fffdf3;--ink:#27331c;--ink-soft:#5c6b47;
            --hoja:#6f9147;--hoja-oscura:#48642d;--limon:#eccf82;--limon-oscuro:#c9a253;
            --menta-linea:rgba(39,51,28,.16);--menta-linea-fuerte:rgba(39,51,28,.3);
            --rosa-oscuro:#e587a8;--sombra-hoja:rgba(72,100,45,.28);
        }
        *{box-sizing:border-box;margin:0;padding:0}
        body{
            font-family:'Nunito',ui-sans-serif,system-ui,sans-serif;color:var(--ink);
            background-color:var(--bg);
            background-image:linear-gradient(var(--menta-linea) 1px,transparent 1px),linear-gradient(90deg,var(--menta-linea) 1px,transparent 1px);
            background-size:28px 28px;
            min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 24px;text-align:center;
        }
        .card{background:var(--paper);border:1px solid var(--menta-linea-fuerte);border-radius:26px 26px 26px 4px;padding:56px 44px;max-width:480px;box-shadow:0 26px 60px rgba(39,51,28,.14)}
        .codigo{font-family:'Fraunces',serif;font-style:italic;font-weight:600;font-size:5rem;line-height:1;background:linear-gradient(100deg,var(--hoja-oscura),var(--rosa-oscuro) 55%,var(--limon-oscuro));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:12px}
        h1{font-family:'Fraunces',serif;font-style:italic;font-weight:560;font-size:1.6rem;margin-bottom:14px;color:var(--ink)}
        p{color:var(--ink-soft);font-size:15px;line-height:1.6;margin-bottom:28px}
        a.btn{display:inline-block;padding:14px 32px;background:var(--limon);color:var(--ink);text-decoration:none;font-weight:700;font-size:14.5px;border-radius:30px;box-shadow:0 10px 26px var(--sombra-hoja);transition:transform .3s,background-color .3s}
        a.btn:hover{background:var(--limon-oscuro);transform:translateY(-3px)}
    </style>
</head>
<body>
    <div class="card">
        <div class="codigo">404</div>
        <h1>Esta página se ha perdido por el camino</h1>
        <p>El enlace que has seguido no existe o se ha movido. Vuelve al inicio y te ayudamos a encontrar lo que buscabas.</p>
        <a class="btn" href="/">Volver a jhprogram</a>
    </div>
</body>
</html>
